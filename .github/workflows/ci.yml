name: Continuous Integration

on:
  push:
    branches-ignore: [ experimental ]
  pull_request:
    branches-ignore: [ experimental ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked --dev

      - name: Enforce Code Style & Linting (Ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Static Type Audit (Mypy)
        run: uv run mypy src

      - name: Security Audit (Bandit)
        run: uv run bandit --recursive src --severity-level all

      - name: Execute Tests via Pytest
        run: uv run pytest
